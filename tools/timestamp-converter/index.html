<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Timestamp Converter - Unix time, IST, UTC and more (offline)</title>
    <meta
      name="description"
      content="Convert Unix timestamps and dates between time zones with correct daylight saving, see relative time and the difference between two moments. Runs in your browser; nothing is uploaded."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container wide">
      <header class="site">
        <div>
          <h1>Timestamp Converter</h1>
          <p>Unix time, ISO 8601 or a plain date in, every time zone out.</p>
        </div>
        <span class="badge">Works offline - nothing leaves this device</span>
      </header>

      <section class="card" aria-labelledby="h-in">
        <h2 id="h-in">1. The moment</h2>
        <label for="src">Type a Unix timestamp, an ISO date, a date like 23/10/2026 14:30, or "now"</label>
        <input type="text" id="src" spellcheck="false" autocomplete="off" />
        <div class="grid">
          <div>
            <label for="zone">If the input has no time zone, read it in</label
            ><select id="zone"></select>
          </div>
        </div>
        <div class="row">
          <button id="now" type="button">Use the current time</button><button id="live" type="button">Live clock: off</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="card" aria-labelledby="h-out">
        <h2 id="h-out">2. The same moment everywhere</h2>
        <div class="stats" id="stats"></div>
        <p id="rel"></p>
        <div class="table-wrap"><table id="t-zones"></table></div>
        <div class="row">
          <button id="copy-s" type="button">Copy Unix seconds</button><button id="copy-ms" type="button">Copy milliseconds</button
          ><button id="copy-iso" type="button">Copy ISO (UTC)</button>
        </div>
        <p class="status" id="out-status" role="status"></p>
      </section>

      <section class="card" aria-labelledby="h-d">
        <h2 id="h-d">Time between two moments</h2>
        <div class="grid">
          <div><label for="d1">From</label><input type="text" id="d1" spellcheck="false" /></div>
          <div><label for="d2">To</label><input type="text" id="d2" spellcheck="false" /></div>
        </div>
        <p id="diff"></p>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed</footer>
    </main>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
