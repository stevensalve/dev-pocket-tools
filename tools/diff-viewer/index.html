<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Diff Viewer - compare two texts or files (offline)</title>
    <meta
      name="description"
      content="Compare two texts or files line by line with word-level highlights and export a unified diff. Runs in your browser; nothing is uploaded."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container wide">
      <header class="site">
        <div>
          <h1>Diff Viewer</h1>
          <p>Paste two versions, or drop two files, and see exactly what changed.</p>
        </div>
        <span class="badge">Works offline - nothing leaves this device</span>
      </header>

      <section class="card" aria-labelledby="h-in">
        <h2 id="h-in">1. The two versions</h2>
        <div class="two">
          <div>
            <label for="a">Original</label>
            <textarea class="code" id="a" rows="12" spellcheck="false"></textarea>
            <label class="file">Open a file<input type="file" id="fa" /></label>
          </div>
          <div>
            <label for="b">Changed</label>
            <textarea class="code" id="b" rows="12" spellcheck="false"></textarea>
            <label class="file">Open a file<input type="file" id="fb" /></label>
          </div>
        </div>
        <div class="row">
          <label class="inline"><input type="checkbox" id="ws" /> Ignore spaces and tabs</label>
          <label class="inline"><input type="checkbox" id="case" /> Ignore upper/lower case</label>
          <label class="inline"><input type="checkbox" id="only" /> Show only changes (with 3 lines around)</label>
          <button id="demo" type="button">Load sample</button>
          <button id="swap" type="button">Swap sides</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="card" aria-labelledby="h-out">
        <h2 id="h-out">2. Differences</h2>
        <div class="stats" id="stats"></div>
        <ul class="tips" id="notes"></ul>
        <div class="table-wrap"><table class="diff" id="t-diff"></table></div>
        <h3>Unified diff</h3>
        <pre class="code" id="unified"></pre>
        <div class="row">
          <button class="primary" id="copy" type="button">Copy unified diff</button>
          <button id="download" type="button">Download .diff</button>
        </div>
        <p class="status" id="out-status" role="status"></p>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed</footer>
    </main>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
